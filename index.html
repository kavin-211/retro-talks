<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luxury Launch Countdown</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    
    /* Background with logo image */
    background: 
      linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.85)),
      url("./logo.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    padding: 20px;
  }

  .countdown-wrapper {
    background: rgba(255, 255, 255, 0.92);
    border: 2px solid #8B0000;
    border-radius: 20px;
    padding: 40px 35px;
    box-shadow: 0 18px 45px rgba(139, 0, 0, 0.35);
    max-width: 95%;
    backdrop-filter: blur(5px);
    position: relative;
    z-index: 10;
  }

  .heading {
    font-family: 'Great Vibes', cursive;
    font-size: 34px;
    text-align: center;
    color: #8B0000;
    margin-bottom: 22px;
  }

  .countdown {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: nowrap;
  }

  .time-box {
    background: linear-gradient(180deg, #ffffff, #FFF0F0);
    border: 1.5px solid #8B0000;
    border-radius: 14px;
    padding: 18px 14px;
    min-width: 80px;
    text-align: center;
    box-shadow: 0 6px 15px rgba(139, 0, 0, 0.15);
    transition: transform 0.3s ease;
  }

  .time-box:hover {
    transform: translateY(-5px);
  }

  .time {
    font-size: 28px;
    font-weight: 600;
    color: #8B0000;
    line-height: 1;
  }

  .label {
    font-size: 12px;
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8B0000;
    font-weight: 600;
  }

  /* Logo overlay styling */
  .logo-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    /* opacity: 0.7; */
    background: 
      url("./logo.jpg") 
      center/cover no-repeat;
    pointer-events: none;
  }

  /* Decorative elements */
  .decoration {
    position: fixed;
    z-index: 2;
    pointer-events: none;
  }
  
  .decoration-1 {
    top: 20px;
    right: 20px;
    width: 80px;
    height: 80px;
    border-right: 2px solid rgba(139, 0, 0, 0.3);
    border-bottom: 2px solid rgba(139, 0, 0, 0.3);
  }
  
  .decoration-2 {
    bottom: 20px;
    left: 20px;
    width: 60px;
    height: 60px;
    border-left: 2px solid rgba(139, 0, 0, 0.3);
    border-top: 2px solid rgba(139, 0, 0, 0.3);
  }

  /* Mobile fine tuning */
  @media (max-width: 768px) {
    .heading {
      font-size: 28px;
    }
    
    .countdown-wrapper {
      padding: 30px 25px;
    }
    
    .countdown {
      gap: 12px;
    }
    
    .time-box {
      min-width: 70px;
      padding: 14px 10px;
    }
    
    .time {
      font-size: 24px;
    }
    
    .label {
      font-size: 10px;
    }
  }

  @media (max-width: 480px) {
    .heading {
      font-size: 24px;
    }
    
    .countdown {
      gap: 8px;
    }
    
    .time-box {
      min-width: 65px;
      padding: 12px 8px;
    }
    
    .time {
      font-size: 20px;
    }
    
    .label {
      font-size: 9px;
    }
  }
</style>
</head>
<body>

<!-- Background logo overlay -->
<div class="logo-overlay"></div>

<!-- Decorative elements -->
<div class="decoration decoration-1"></div>
<div class="decoration decoration-2"></div>

<!-- Countdown Container -->
<div class="countdown-wrapper">
  <div class="heading">Will be Launching In</div>

  <div class="countdown">
    <div class="time-box">
      <div class="time" id="hours">00</div>
      <div class="label">Hours</div>
    </div>
    <div class="time-box">
      <div class="time" id="minutes">00</div>
      <div class="label">Minutes</div>
    </div>
    <div class="time-box">
      <div class="time" id="seconds">00</div>
      <div class="label">Seconds</div>
    </div>
  </div>
</div>

<script>
  // 🎯 SET YOUR DATE & TIME HERE
  const launchDate = new Date("2026-02-01T12:00:00").getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const diff = launchDate - now;

    if (diff <= 0) {
      document.querySelector('.heading').innerText = "We Are Live ✨";
      document.querySelector('.heading').style.fontSize = "42px";
      document.querySelector('.countdown').style.display = "none";
      return;
    }

    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("hours").innerText = String(hours).padStart(2, "0");
    document.getElementById("minutes").innerText = String(minutes).padStart(2, "0");
    document.getElementById("seconds").innerText = String(seconds).padStart(2, "0");
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();
</script>

</body>
</html>
